variables:
  ZIG_VERSION: "0.15.1"

include:
  # Security scanning (Advanced SAST enabled by default)
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1
    inputs:
      allow_failure: true

stages:
  - build
  - test
  - security
  - sbom

# Template for Zig jobs
.zig:
  image: alpine:latest
  before_script:
    - apk add --no-cache curl xz git
    - curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ
    - export PATH="$PWD/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
    - zig version

# Build job - verify compilation
build:
  extends: .zig
  stage: build
  script:
    - export PATH="$PWD/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
    - zig build check

# Unit tests
test-unit:
  extends: .zig
  stage: test
  script:
    - export PATH="$PWD/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
    - zig build test-unit
    - zig build test-accept
    - zig build test-scanner
    - zig build test-emitter
    - zig build test-roundtrip

# YAML Test Suite - runs against official yaml-test-suite
test-suite:
  extends: .zig
  stage: test
  script:
    - export PATH="$PWD/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
    # Clone the official YAML test suite
    - git clone --depth 1 https://github.com/yaml/yaml-test-suite.git testdata/yaml-test-suite
    # Run the test suite
    - zig build test-suite

